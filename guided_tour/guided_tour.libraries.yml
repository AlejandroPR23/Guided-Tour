driverjs:
  remote: https://driverjs.com
  version: "1"
  license:
    name: MIT
    url: https://github.com/kamranahmedse/driver.js/blob/master/LICENSE
    gpl-compatible: true
  js:
    https://cdn.jsdelivr.net/npm/driver.js@1/dist/driver.js.iife.js:
      type: external
      minified: true
  css:
    theme:
      https://cdn.jsdelivr.net/npm/driver.js@1/dist/driver.css:
        type: external
        minified: true

guided_tour:
  version: 1.x
  js:
    js/guided_tour.js: {}
  css:
    theme:
      css/guided_tour.css: {}
  dependencies:
    - guided_tour/driverjs
    - core/drupal
    - core/drupalSettings
    - core/once
