id: homepage_anonymous
label: 'Tour de bienvenida - Usuarios anónimos'
status: true

# Rutas donde aplica este tour (nombres de ruta de Drupal).
routes:
  - '<front>'
  - 'view.frontpage.page_1'

# Roles que ven este tour.
roles:
  - anonymous

# Cuántos días se recuerda que ya lo vio (cookie).
cookie_days: 365

# TRUE = espera a que los Web Components terminen su upgrade antes de iniciar.
wait_for_wc: true

options:
  defaultStepOptions:
    scrollTo: true
    cancelIcon:
      enabled: true
  useModalOverlay: true

steps:
  -
    id: step-welcome
    # Selector compatible con Web Components:
    # Puedes usar el tag del componente directamente, ej: 'app-header'
    # o un atributo data: '[data-tour="main-header"]'
    attachTo:
      element: '[data-tour="main-header"]'
      on: bottom
    title: '¡Bienvenido!'
    text: 'Esta es la página principal. Aquí encontrarás todo el contenido relevante.'
    buttons:
      -
        text: 'Siguiente'
        type: next
      -
        text: 'Omitir tour'
        type: cancel
        secondary: true

  -
    id: step-navigation
    attachTo:
      element: '[data-tour="main-nav"]'
      on: bottom
    title: 'Navegación principal'
    text: 'Usa este menú para moverte entre las secciones del sitio.'
    buttons:
      -
        text: 'Anterior'
        type: back
      -
        text: 'Siguiente'
        type: next

  -
    id: step-search
    attachTo:
      element: '[data-tour="search-bar"]'
      on: bottom
    title: 'Búsqueda'
    text: 'Desde aquí puedes buscar cualquier contenido del sitio.'
    buttons:
      -
        text: 'Anterior'
        type: back
      -
        text: '¡Entendido!'
        type: next
